# QuestShell — nginx-proxy vhost override for terminalking.com
#
# Place this file at:
#   /var/lib/docker/volumes/nginx-proxy_vhost/_data/terminalking.com
#
# Or if using a custom path, mount it to:
#   /etc/nginx/vhost.d/terminalking.com
#
# This file is INCLUDED by the auto-generated nginx-proxy server block
# for terminalking.com.  It adds:
#   1. /terminal/ path routing to the quest-shell container
#   2. HTTP Basic Auth on /terminal/*
#   3. WebSocket upgrade support
#   4. Security headers
#   5. Trusted identity header injection
#
# The root path (/) continues to route to terminalking-ghost as before.

# ── Rate limiting ────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=quest_shell_auth:10m rate=5r/s;

# ── Location: /terminal/ → quest-shell ───────────────────────────
location /terminal/ {

    # --- Authentication gate ---
    # No request reaches quest-shell without valid Basic Auth.
    auth_basic "QuestShell — Authentication Required";
    auth_basic_user_file /etc/nginx/htpasswd/terminalking.htpasswd;

    # --- Rate limit on auth attempts ---
    limit_req zone=quest_shell_auth burst=10 nodelay;

    # --- Proxy to quest-shell container ---
    # nginx-proxy auto-generates an upstream for the quest-shell container.
    # We reference it by the container's internal hostname on the nginx-proxy network.
    proxy_pass http://quest-shell:2222/;

    # --- Standard proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --- Trusted identity header (SET BY nginx, not by clients) ---
    # $remote_user is populated by auth_basic after successful authentication.
    # This is safe because nginx controls it — clients cannot forge it.
    proxy_set_header X-Authenticated-User $remote_user;

    # --- Strip client-supplied auth headers (defense in depth) ---
    proxy_set_header Authorization "";

    # --- WebSocket upgrade (required for WebSSH2 / Socket.IO) ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- Timeouts (SSH sessions are long-lived) ---
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    # --- Real-time I/O (no buffering) ---
    proxy_buffering off;
    proxy_cache off;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://terminalking.com; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
}

# ── Redirect /terminal → /terminal/ ─────────────────────────────
location = /terminal {
    return 301 /terminal/;
}
