# Terminal King Terminal — nginx-proxy vhost override for terminalking.com
#
# Place this file at:
#   /var/lib/docker/volumes/proxy_vhost/_data/terminalking.com
#
# This file is INCLUDED by the auto-generated nginx-proxy server block
# for terminalking.com (inside the server {} block).
#
# Routing:
#   /              → terminalking-ghost (existing Ghost blog, UNAFFECTED)
#   /terminal/     → public landing page (no auth)
#   /terminal/app/ → actual terminal app (behind HTTP Basic Auth)

# ── Location: /terminal/app/ → terminal app (authenticated) ─────
location /terminal/app/ {

    # --- Authentication gate ---
    auth_basic "Terminal King Terminal — Authentication Required";
    auth_basic_user_file /etc/nginx/htpasswd/terminalking.htpasswd;

    # --- Proxy to terminal-king-terminal container ---
    proxy_pass http://terminal-king-terminal:2222/;

    # --- Standard proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --- Trusted identity header (SET BY nginx, not by clients) ---
    proxy_set_header X-Authenticated-User $remote_user;

    # --- Strip client-supplied auth headers ---
    proxy_set_header Authorization "";

    # --- WebSocket upgrade (required for WebSSH2 / Socket.IO) ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- Timeouts (SSH sessions are long-lived) ---
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    # --- Real-time I/O (no buffering) ---
    proxy_buffering off;
    proxy_cache off;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://terminalking.com; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
}

# ── Redirect /terminal/app → /terminal/app/ ─────────────────────
location = /terminal/app {
    return 301 /terminal/app/;
}

# ── Location: /terminal/ → landing page (public, no auth) ───────
location /terminal/ {
    alias /var/www/terminalking.com/terminal-king-terminal/landing-page/;
    index index.html;
    try_files $uri $uri/ =404;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

# ── Redirect /terminal → /terminal/ ─────────────────────────────
location = /terminal {
    return 301 /terminal/;
}
