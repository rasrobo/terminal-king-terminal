# Terminal King Terminal — nginx-proxy vhost override for terminalking.com
#
# Routing:
#   /              → terminalking-ghost (existing Ghost blog, UNAFFECTED)
#   /terminal/     → public landing page (no auth, served from terminal container)
#   /terminal/app/ → actual terminal app (behind HTTP Basic Auth)

# ── Location: /terminal/app/ → terminal app (authenticated) ─────
location /terminal/app/ {

    auth_basic "Terminal King Terminal — Authentication Required";
    auth_basic_user_file /etc/nginx/htpasswd/terminalking.htpasswd;

    proxy_pass http://terminal-king-terminal:2222/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header X-Authenticated-User $remote_user;
    proxy_set_header Authorization "";

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    proxy_buffering off;
    proxy_cache off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://terminalking.com; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
}

location = /terminal/app {
    return 301 /terminal/app/;
}

# ── Location: /terminal/ → landing page (public, no auth) ───────
# Served from the terminal container's static files
location /terminal/ {
    proxy_pass http://terminal-king-terminal:2222/landing.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /terminal {
    return 301 /terminal/;
}
